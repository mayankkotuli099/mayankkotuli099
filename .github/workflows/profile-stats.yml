name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # ---------------- CHECKOUT ----------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------- CREATE FOLDER ----------------
      - name: Create profile folder
        run: mkdir -p profile

      # ---------------- GITHUB STATS ----------------
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mayankkotuli099&show_icons=true&theme=dark&hide_border=true&count_private=true&hide_rank=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- TOP LANGUAGES ----------------
      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mayankkotuli099&layout=compact&theme=dark&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- STREAK ----------------
      - name: Generate GitHub Streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=mayankkotuli099&theme=dark&hide_border=true&background=00000000
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---------------- ACTIVITY GRAPH ----------------
      - name: Generate Contribution Activity
        run: |
          curl -sSfL \
          "https://github-readme-activity-graph.vercel.app/graph?username=mayankkotuli099&theme=react-dark&hide_border=true&height=280" \
          -o profile/activity.svg

      # ---------------- TROPHIES ----------------
      - name: Generate GitHub Trophies
        run: |
          curl -sSfL \
          "https://github-profile-trophy.vercel.app/?username=mayankkotuli099&theme=darkhub&no-frame=true&margin-w=8&margin-h=8&column=-1&row=1" \
          -o profile/trophies.svg

      # ---------------- COMMIT & PUSH ----------------
      - name: Commit updated profile stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats"
            git push
          fi
