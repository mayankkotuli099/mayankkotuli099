name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      # ---------------- GITHUB STATS ----------------

      - name: Generate GitHub Stats
        run: |
          curl -L \
          "https://github-readme-stats.vercel.app/api?username=mayankkotuli099&show_icons=true&theme=dark&hide_border=true&count_private=true&hide_rank=false" \
          -o profile/stats.svg

      # ---------------- TOP LANGUAGES ----------------

      - name: Generate Top Languages
        run: |
          curl -L \
          "https://github-readme-stats.vercel.app/api/top-langs/?username=mayankkotuli099&layout=compact&theme=dark&hide_border=true&langs_count=6" \
          -o profile/top-langs.svg

      # ---------------- STREAK ----------------

      - name: Generate GitHub Streak
        run: |
          curl -L \
          "https://streak-stats.demolab.com/?user=mayankkotuli099&theme=dark&hide_border=true&background=00000000" \
          -o profile/streak.svg

      # ---------------- ACTIVITY GRAPH ----------------

      - name: Generate Contribution Activity
        run: |
          curl -L \
          "https://github-readme-activity-graph.vercel.app/graph?username=mayankkotuli099&theme=react-dark&hide_border=true&height=280" \
          -o profile/activity.svg

      # ---------------- TROPHIES ----------------

      - name: Generate GitHub Trophies
        run: |
          curl -L \
          "https://github-profile-trophy.vercel.app/?username=mayankkotuli099&theme=darkhub&no-frame=true&margin-w=8&margin-h=8&column=-1&row=1" \
          -o profile/trophies.svg

      # ---------------- COMMIT ----------------

      - name: Commit updated SVG files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats"
            git push
          fi
