name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, midnight UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ensure output folder exists
        run: mkdir -p profile

      # --- GitHub Stats card -------------------------------------------------
      - name: Generate GitHub Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=mayankkotuli099&show_icons=true&theme=dark&hide_border=true&count_private=true&hide_rank=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Top Languages card -------------------------------------------------
      - name: Generate Top Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=mayankkotuli099&layout=compact&theme=dark&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Streak card ---------------------------------------------------------
      - name: Generate Streak Stats card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=mayankkotuli099&theme=dark&hide_border=true&background=00000000
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # --- Contribution activity graph -----------------------------------------
      # No maintained self-host Action exists for this one, so we fetch the SVG
      # at build time and commit it — this removes the client-side dependency
      # on the live endpoint, which is what was causing the broken image.
      - name: Fetch Contribution Activity graph
        run: |
          curl -sSfL "https://github-readme-activity-graph.vercel.app/graph?username=mayankkotuli099&theme=react-dark&hide_border=true&height=280" \
            -o profile/activity.svg || echo "activity graph fetch failed, keeping previous version"

      # --- GitHub Trophies ------------------------------------------------------
      - name: Fetch GitHub Trophies
        run: |
          curl -sSfL "https://github-profile-trophy.vercel.app/?username=mayankkotuli099&theme=darkhub&no-frame=true&margin-w=8&margin-h=8&column=-1&row=1" \
            -o profile/trophies.svg || echo "trophies fetch failed, keeping previous version"

      # --- Commit only if something changed -------------------------------------
      - name: Commit and push updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: update profile stats [skip ci]"
          git push
