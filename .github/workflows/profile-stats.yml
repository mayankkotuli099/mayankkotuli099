name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile folder
        run: mkdir -p profile

      # GitHub Stats
      - name: Generate GitHub Stats
        run: |
          curl -fL --retry 3 \
          "https://github-stats-extended.vercel.app/api?username=mayankkotuli099&show_icons=true&theme=dark&hide_border=true&count_private=true&hide_rank=false" \
          -o profile/stats.svg

      # Top Languages
      - name: Generate Top Languages
        run: |
          curl -fL --retry 3 \
          "https://github-stats-extended.vercel.app/api/top-langs/?username=mayankkotuli099&layout=compact&theme=dark&hide_border=true&langs_count=6" \
          -o profile/top-langs.svg

      # Streak
      - name: Generate Streak
        run: |
          curl -fL --retry 3 \
          "https://streak-stats.demolab.com/?user=mayankkotuli099&theme=dark&hide_border=true&background=00000000" \
          -o profile/streak.svg

      # Activity Graph
      - name: Generate Activity Graph
        run: |
          curl -fL --retry 3 \
          "https://github-readme-activity-graph.vercel.app/graph?username=mayankkotuli099&theme=react-dark&hide_border=true&height=280" \
          -o profile/activity.svg

      # Verify SVG files
      - name: Verify generated files
        run: |
          echo "Generated files:"
          ls -lh profile/

          echo "Checking SVG files..."

          for file in profile/*.svg; do
            if ! grep -q "<svg" "$file"; then
              echo "ERROR: $file is not a valid SVG"
              head -c 300 "$file"
              exit 1
            fi
          done

          echo "All SVG files are valid."

      # Commit
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile stats"
            git push
          fi
